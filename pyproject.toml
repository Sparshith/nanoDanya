[project]
name = "chess-gpt"
version = "0.1.0"
description = "Minimal workflow for training a GPT model on SAN chess moves"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "pyarrow",
    "tokenizers",
    "tiktoken",
    "python-chess",
    "tqdm",
    "zstandard",
    "requests",
    "rich",
    "nanochat",
    "transformers>=5.3.0",
]

[tool.uv.sources]
nanochat = { path = "nanochat", editable = true }

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
]
